name: Research papers CI

on:
  push:
    paths:
      - "docs/*.tex"
      - "docs/proofs/*.py"
      - ".github/workflows/research-papers.yml"
  pull_request:
    paths:
      - "docs/*.tex"
      - "docs/proofs/*.py"
      - ".github/workflows/research-papers.yml"

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run exact mathematical verifiers
        run: |
          python3 docs/proofs/verify_quantinion_simplex_cubic.py
          python3 docs/proofs/verify_cubic_dictionary_capacity.py
          python3 docs/proofs/verify_quantinion_operator_geometry.py
          python3 docs/proofs/verify_dyadic_nplus2_cubic.py

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended

      - name: Build Paper 1
        run: latexmk -pdf -halt-on-error -interaction=nonstopmode -outdir=build/paper1 docs/quantinion_simplex_cubic_decomposition.tex

      - name: Build Paper 2
        run: latexmk -pdf -halt-on-error -interaction=nonstopmode -outdir=build/paper2 docs/exact_cubic_dictionary_capacity.tex

      - name: Build Paper 3
        run: latexmk -pdf -halt-on-error -interaction=nonstopmode -outdir=build/paper3 docs/quantinion_operator_transpose_geometry.tex

      - name: Build Main Classification Paper
        run: latexmk -pdf -halt-on-error -interaction=nonstopmode -outdir=build/main docs/dyadic_nplus2_cubic_identifiability.tex

      - name: Upload compiled manuscripts
        uses: actions/upload-artifact@v7
        with:
          name: research-papers
          path: |
            build/paper1/*.pdf
            build/paper2/*.pdf
            build/paper3/*.pdf
            build/main/*.pdf
